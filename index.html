<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estacionamento Fácil</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>Estacionamento Fácil</h1>

<form action="calcular.php" method="post">

<p>
    <label for="horas">Horas</label>
    <input type="number" name="horas" id="horas" min="1" required>
</p>

<p>
    <label>Veículo</label>
    <input type="radio" name="veiculo" id="carro" value="0" required> Carro
    <br>
    <input type="radio" name="veiculo" id="moto" value="1"> Moto
</p>

<p>
    <input type="checkbox" name="lavagem" id="lavagem"> Lavagem
</p>

<p>
    <input type="submit" value="Calcular">
    <input type="reset" value="Limpar">
</p>

</form>

</body>
</html>
